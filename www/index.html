<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F6FB">
<title>Süre Sayacı</title>
<style>
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#F4F6FB;color:#1D2842;font-family:system-ui,sans-serif;text-align:center}
.s{width:44px;height:44px;border-radius:50%;border:5px solid #E7EBF4;border-top-color:#3F5EFB;animation:r 1s linear infinite;margin:0 auto 16px}
@keyframes r{to{transform:rotate(360deg)}}
#err{display:none;padding:24px}
button{font:inherit;font-weight:800;height:52px;padding:0 28px;border:0;border-radius:18px;background:#3F5EFB;color:#fff}
</style>
</head>
<body>
<div id="ld"><div class="s"></div><p>Yükleniyor</p></div>
<div id="err"><p>Uygulama açılamadı. İnternet bağlantını kontrol et.</p><button onclick="go()">Tekrar dene</button></div>
<script>
var APP="https://mevafeyzasavas-byte.github.io/chronometer/";
function go(){
  document.getElementById("err").style.display="none";
  document.getElementById("ld").style.display="block";
  location.replace(APP);
  setTimeout(function(){document.getElementById("ld").style.display="none";document.getElementById("err").style.display="block"},8000);
}
go();
</script>
</body>
</html>
